<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Hrsh Venket</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="brand" href="/">Hrsh Venket</a>
      <nav>
        <a href="/">profile</a>
        <a href="/projects/" class="active">projects</a>
        <a href="/blog/">blog</a>
        <a href="https://tft-app.hrsh.uk/">tft-app</a>
      </nav>
    </header>

    <main>
      <h1>Projects</h1>
      <p>This site is a work in progress. All my projects are available on <a href="https://github.com/Hrsh-Venket">GitHub</a>.</p>

      <ul class="listing" id="list">
        <li><span class="desc">Loading…</span></li>
      </ul>

    <footer class="site">
      &copy; <span id="year"></span> Hrsh Venket
    </footer>
  </div>
  <script src="/assets/js/site.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    renderListing({
      manifestUrl: '/projects/posts.json',
      postsBaseUrl: '/projects/posts/',
      postViewerUrl: '/projects/post.html',
      listEl: document.getElementById('list'),
      emptyText: 'No projects yet.'
    });
  </script>
</body>
</html>
